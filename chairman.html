<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المورد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=12"><style>.chip{display:inline-block;background:#e8f1f0;border:1px solid var(--line);border-radius:20px;padding:4px 12px;margin:4px 4px 0 0;font-size:.85rem;cursor:pointer}.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}</style></head><body>
<main><div id="msg" class="hide"></div><div class="cards" id="pb" style="margin-bottom:12px"></div><div id="pl" class="hide"></div><div id="rp" class="hide"></div><input id="q" placeholder="اكتب كود المورد أو اسمه أو جزءًا منه" oninput="find()" style="margin-bottom:12px"><div id="res"></div><div id="det" class="hide"></div></main>
<script src="js/app.js?v=12"></script><script>
guard(['chairman','manager','admin']);let t;
async function pend(){const box=$('#pl');if(!box.classList.contains('hide')){box.className='hide';return}
const p=await api('payments?status=eq.pending&select=id,amount,note,created_at,invoices(amount,code,suppliers(name),contracts(title),payments(amount,status)),cr:users!payments_created_by_fkey(full_name)&order=created_at');
box.className='card';box.innerHTML='<h2>بانتظار اعتماد مدير الحسابات</h2>'+(p.map(x=>`<div class="row"><div><span class="t">${x.invoices.suppliers.name}</span><small>${x.invoices.contracts.title} • ${x.invoices.code||''}</small><small>المحاسب: ${x.cr?.full_name||''} • ${fdate(x.created_at)}</small>${x.note?`<small>بيان: ${x.note}</small>`:''}</div><div style="text-align:end"><div class="amt">${money(x.amount)}</div><button class="b s" onclick="chg('${x.id}',${x.amount},${x.invoices.amount-paidOf(x.invoices)})">تعديل المبلغ</button></div></div>`).join('')||'<small>لا توجد طلبات معلقة</small>')}
async function chg(id,cur,max){const v=prompt('المبلغ الجديد (الحد الأقصى '+max+')',cur);if(v===null)return;const n=+v;if(!(n>0)||n>max)return msg('المبلغ غير صالح أو أكبر من المتبقي',1);
await api('payments?id=eq.'+id,'PATCH',{amount:n});msg('تم تعديل المبلغ — بانتظار اعتماد مدير الحسابات');$('#pl').className='hide';pend();cnt()}
function find(){clearTimeout(t);t=setTimeout(async()=>{const v=$('#q').value.trim();$('#det').className='hide';if(!v)return $('#res').innerHTML='';
const s=await api(`suppliers?or=(name.ilike.*${encodeURIComponent(v)}*,code.ilike.*${encodeURIComponent(v)}*)&limit=15`);
$('#res').innerHTML=s.map(x=>`<div class="card" onclick="show('${x.id}')" style="cursor:pointer"><span class="t">${x.name}</span><small>${x.code} • ${x.field||''}</small></div>`).join('')||'<div class="msg">لا توجد نتائج</div>'},250)}
async function show(id){$('#res').innerHTML='';const s=(await api('suppliers?id=eq.'+id))[0];
const inv=await api(`invoices?supplier_id=eq.${id}&select=*,contracts(title),cr:users!invoices_created_by_fkey(full_name),payments(amount,note,status,created_at,pc:users!payments_created_by_fkey(full_name))&order=created_at.desc`);
const pays=inv.filter(i=>i.type!='income'),tot=pays.reduce((a,i)=>a+paidOf(i),0),rest=pays.reduce((a,i)=>a+Math.max(0,i.amount-paidOf(i)),0),ld=i=>Math.max(0,...(i.payments||[]).filter(p=>p.status=='approved').map(p=>+new Date(p.created_at))),last=inv.filter(i=>paidOf(i)>0).sort((a,b)=>ld(b)-ld(a))[0];
window._i=inv;const dep=inv.filter(i=>i.type=='income').reduce((a,i)=>a+paidOf(i),0);const g={};inv.forEach(i=>{const k=i.contract_id;g[k]=g[k]||{t:i.contracts.title,p:0,r:0,d:0};if(i.type=='income'){g[k].d+=paidOf(i);return}g[k].p+=paidOf(i);g[k].r+=Math.max(0,i.amount-paidOf(i))});
$('#det').className='';$('#det').innerHTML=`<div class="card"><h2>${s.name}</h2><small>${s.code} • ${s.phone?`<a href="tel:${s.phone}">${s.phone}</a>`:''} • ${s.field||''}</small></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"><div class="stat"><small>إجمالي المدفوع (دفع)</small><b>${money(tot)}</b></div><div class="stat link" onclick="partial()"><small>إجمالي الباقي (اضغط)</small><b>${money(rest)}</b></div>${dep?`<div class="stat"><small>إجمالي الإيداع من المورد</small><b>${money(dep)}</b></div>`:''}</div>
<div class="card" style="margin-top:12px"><h2>حسب التعاقد</h2>${Object.entries(g).map(([k,v])=>`<div class="row" onclick="showPays('${k}')" style="cursor:pointer"><div><span class="t">${v.t}</span><small>اضغط لعرض تفاصيله</small></div><div class="amt">${money(v.p)}<small style="color:var(--bad)">باقٍ ${money(v.r)}</small>${v.d?`<small style="color:#237a4b">إيداع ${money(v.d)}</small>`:''}</div></div>`).join('')||'<small>لا توجد تعاقدات</small>'}</div>
${last?`<div class="card"><h2>آخر فاتورة معتمدة</h2><div class="row"><div><span class="t">${last.contracts.title}</span>${tb(last)}<small>${last.code||''} • ${fdate(last.created_at)}</small><small>${last.description||''}</small><small>نفّذها: ${last.cr?.full_name||''}</small><small>آخر دفعة معتمدة: ${fdate(ld(last))}</small></div><div class="amt">${money(last.amount)}<small>مدفوع ${money(paidOf(last))}</small></div></div>${last.image_url?`<a href="${last.image_url}" target="_blank">صورة الفاتورة</a>`:''}</div>`:''}
<button class="b g" onclick="showPays()">عرض تفصيلي لكل المدفوعات</button><div id="more"></div>`}
function showPays(cid){const rows=[];_i.filter(i=>!cid||i.contract_id==cid).forEach(i=>(i.payments||[]).filter(p=>p.status=='approved').forEach(p=>rows.push({i,p})));rows.sort((a,b)=>new Date(b.p.created_at)-new Date(a.p.created_at));
$('#more').innerHTML=`<h2 style="margin-top:14px">${cid?'مدفوعات التعاقد':'كل المدفوعات'}</h2><small>إجمالي الشهر يشمل الدفع فقط ولا يشمل الإيداع</small>`+(months(rows,x=>x.p.created_at,x=>`<div class="row"><div><span class="t">${x.i.contracts.title}</span>${tb(x.i)}<small>${x.i.description||''} • ${fdate(x.p.created_at)}</small><small>نفّذها: ${x.p.pc?.full_name||''}</small>${x.p.note?`<small>بيان: ${x.p.note}</small>`:''}</div><div class="amt">${money(x.p.amount)}</div></div>`,x=>x.i.type=='income'?0:+x.p.amount)||'<small>لا يوجد</small>');$('#more').scrollIntoView()}
function partial(){const r=_i.filter(i=>i.type!='income'&&i.amount-paidOf(i)>0.001).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
$('#more').innerHTML='<h2 style="margin-top:14px">فواتير بها باقٍ</h2>'+(months(r,x=>x.created_at,i=>`<div class="row"><div><span class="t">${i.contracts.title}</span>${tb(i)}<small>${i.code||''} • ${i.description||''} • ${fdate(i.created_at)}</small><small>الفاتورة ${money(i.amount)} • مدفوع ${money(paidOf(i))}</small><small>أنشأها: ${i.cr?.full_name||'—'}</small>${payers(i)}</div><div class="amt" style="color:var(--bad)">${money(i.amount-paidOf(i))}</div></div>`,i=>i.amount-paidOf(i))||'<small>لا يوجد باقٍ</small>');$('#more').scrollIntoView()}
async function cnt(){const n=(await api('payments?status=eq.pending&select=id')).length;$('#pb').innerHTML=card('receipt','طلبات بانتظار الاعتماد',n?n+' طلب — اضغط للمتابعة وتعديل المبلغ':'لا توجد طلبات حالية',"pend()")+card('chart','تقرير سريع','المدفوعات والإيرادات: اليوم أو الأسبوع أو الشهر أو فترة',"repOpen()")}

const tb=i=>`<span class="bd ${i.type=='income'?'on':''}" style="margin-inline-start:6px;${i.type=='income'?'':'background:#e8f1f0'}">${({pay:'دفع',income:'إيداع',bill:'فاتورة'})[i.type]||''}</span>`;
const payers=i=>{const n=[...new Set((i.payments||[]).filter(p=>p.status=='approved').map(p=>p.pc?.full_name).filter(Boolean))];return n.length?`<small>دفعها: ${n.join('، ')}</small>`:''};
let ALL=[],SEL=[],LM={};const lday=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let RT='both',RP='day';
const sel=(g,x)=>document.querySelectorAll('#'+g+' button').forEach(y=>y.classList.toggle('on',y==x));
async function repOpen(){const b=$('#rp');if(!b.classList.contains('hide')){b.className='hide';return}
 if(!ALL.length){ALL=await api('suppliers?select=id,name,code&order=name');ALL.forEach(s=>LM[s.name+' ('+s.code+')']=s.id)}
 RT='both';RP='day';b.className='card';
 b.innerHTML=`<h2>تقرير سريع</h2><div class="tabs" id="rt"><button data-v="pay">المدفوعات</button><button data-v="inc">الإيرادات</button><button data-v="both" class="on">الاثنان معًا</button></div>
<div class="tabs" id="rq"><button data-v="day" class="on">اليوم</button><button data-v="week">الأسبوع</button><button data-v="month">الشهر</button><button data-v="custom">فترة</button></div>
<div id="cr" class="grid hide"><div><label>من</label><input id="r1" type="date"></div><div><label>إلى</label><input id="r2" type="date"></div></div><button id="rg" class="b hide" onclick="runRep()">عرض</button>
<details style="margin-top:10px"><summary>تصفية حسب مورد (اختياري)</summary><input id="rs" list="dlr" placeholder="اكتب اسم المورد ثم اخترْه..." oninput="addS()" autocomplete="off" style="margin-top:8px"><datalist id="dlr">${Object.keys(LM).map(k=>`<option value="${k}">`).join('')}</datalist><div id="chips"></div></details><div id="ro"></div>`;
 b.querySelectorAll('#rt button').forEach(x=>x.onclick=()=>{RT=x.dataset.v;sel('rt',x);runRep()});
 b.querySelectorAll('#rq button').forEach(x=>x.onclick=()=>{RP=x.dataset.v;sel('rq',x);const c=RP=='custom';$('#cr').classList.toggle('hide',!c);$('#rg').classList.toggle('hide',!c);if(!c)runRep()});
 runRep();b.scrollIntoView()}
function addS(){const id=LM[$('#rs').value];if(!id)return;if(!SEL.includes(id))SEL.push(id);$('#rs').value='';chips();runRep()}
function rmS(id){SEL=SEL.filter(x=>x!=id);chips();runRep()}
function chips(){$('#chips').innerHTML=SEL.map(id=>`<span class="chip" onclick="rmS('${id}')">${ALL.find(s=>s.id==id).name} ×</span>`).join('')}
async function runRep(){try{const t=new Date(),f=new Date(t);if(RP=='week')f.setDate(t.getDate()-6);if(RP=='month')f.setDate(1);let a=lday(f),b=lday(t);if(RP=='custom'){a=$('#r1').value;b=$('#r2').value}
 let q='payments?status=eq.approved&select=amount,note,created_at,invoices!inner(type,code,description,amount,supplier_id,suppliers(name,code),contracts(title)),pc:users!payments_created_by_fkey(full_name)&order=created_at.desc';
 if(RT=='pay')q+='&invoices.type=in.(pay,bill)';if(RT=='inc')q+='&invoices.type=eq.income';
 if(SEL.length)q+='&invoices.supplier_id=in.('+SEL.join(',')+')';if(a)q+='&created_at=gte.'+a+'T00:00:00Z';if(b)q+='&created_at=lte.'+b+'T23:59:59Z';
 const P=(await api(q)).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at)),isI=x=>x.invoices.type=='income',sum=l=>l.reduce((s,x)=>s+ +x.amount,0),tp=sum(P.filter(x=>!isI(x))),ti=sum(P.filter(isI));
 const st=[];if(RT!='inc')st.push(['إجمالي المدفوع',money(tp),'#b3341f']);if(RT!='pay')st.push(['إجمالي الإيرادات',money(ti),'#237a4b']);if(RT=='both')st.push(['الصافي (الإيراد − المدفوع)',money(ti-tp),ti-tp>=0?'#237a4b':'#b3341f']);
 const g={};P.forEach(x=>{(g[x.created_at.slice(0,10)]=g[x.created_at.slice(0,10)]||[]).push(x)});
 const row=x=>{const i=isI(x);return `<div class="row"><div><span class="t">${x.invoices.suppliers.name}</span>${tb(x.invoices)}<small>${x.invoices.contracts.title} • فاتورة ${x.invoices.code||''}</small>${x.invoices.description?`<small>${x.invoices.description}</small>`:''}${x.note?`<small>بيان: ${x.note}</small>`:''}<small>نفّذها: ${x.pc?.full_name||''}</small></div><div class="amt" style="color:${i?'#237a4b':'#b3341f'};text-align:end">${i?'+':'−'} ${money(x.amount)}<small style="color:#4a5f66">${i?'تم تحصيله':'تم دفعه'} • من فاتورة ${money(x.invoices.amount)}</small></div></div>`};
 $('#ro').innerHTML=`<small style="display:block;margin-top:10px">${a?fdate(a):'البداية'} ← ${b?fdate(b):'اليوم'} • ${P.length} حركة معتمدة</small><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0">${st.map(([k,v,c])=>`<div class="stat"><small>${k}</small><b style="color:${c}">${v}</b></div>`).join('')}</div>`+
 (Object.keys(g).sort().reverse().map(k=>{const L=g[k],d=new Date(k+'T00:00:00Z').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
  return `<div class="mh"><b>${d}</b><span>${L.length} حركة</span></div><div class="mb">${L.map(row).join('')}</div><div class="mf">${RT!='inc'?`مدفوع: <b>${money(sum(L.filter(x=>!isI(x))))}</b>`:''}${RT=='both'?' • ':''}${RT!='pay'?`محصّل: <b>${money(sum(L.filter(isI)))}</b>`:''}</div>`}).join('')||'<div class="msg" style="margin-top:12px">لا توجد حركات معتمدة في هذه الفترة</div>')}catch(e){msg(errT(e),1)}}
cnt();
</script></body></html>
