<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة المورد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=34"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>.chip{display:inline-block;background:#e8f1f0;border:1px solid var(--line);border-radius:20px;padding:4px 12px;margin:4px 4px 0 0;font-size:.85rem;cursor:pointer}.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

<main><div id="msg" class="hide"></div>
<div class="sbar"><input id="q" placeholder="ابحث عن مورد أو موظف أو طالب: بالاسم أو الكود" oninput="find()" autocomplete="off"></div>
<div id="home"><div id="tb"></div><div class="sec">الاعتمادات</div><div class="cards" id="pbA"></div><div class="sec">التقارير والمتابعة</div><div class="cards" id="pbB"></div></div>
<div id="vw" class="hide"><div class="vhd"><button class="back" onclick="goBack()">→ رجوع</button><b id="vt"></b></div>
<div id="pl" class="hide"></div><div id="pi" class="hide"></div><div id="rp" class="hide"></div><div id="cw" class="hide"></div><div id="ac" class="hide"></div><div id="res" class="hide"></div><div id="det" class="hide"></div></div></main>
<script src="js/app.js?v=40"></script><script>
guard(['chairman','manager','admin']);let t,CWK=null,ALLP=false;
const PANELS=['pl','pi','rp','cw','ac','res','det'];
function ov(title){PANELS.forEach(x=>$('#'+x).className='hide');$('#home').classList.add('hide');$('#vw').className='';$('#vt').textContent=title||'';scrollTo(0,0)}
function goHome(){PANELS.forEach(x=>$('#'+x).className='hide');$('#vw').className='hide';$('#home').classList.remove('hide');CWK=null;$('#q').value='';scrollTo(0,0);cnt();chBal()}
function goBack(){if(!$('#det').classList.contains('hide')&&$('#q').value.trim()){find();return}goHome()}
async function pend(){ov('تحويلات بانتظار الاعتماد');$('#cw').className='hide';CWK=null;$('#pi').className='hide';const box=$('#pl');if(!box.classList.contains('hide')){box.className='hide';return}
const p=(await api('payments?status=eq.pending&select=id,amount,note,created_at,invoices(amount,code,image_url,account_id,suppliers(name),contracts(title),payments(amount,status)),cr:users!payments_created_by_fkey(full_name)&order=created_at')).filter(x=>canApv(x.invoices.account_id));
box.className='card';box.innerHTML='<h2>تحويلات بانتظار الاعتماد (يعتمدها رئيس المجلس أو مدير الحسابات)</h2>'+(p.map(x=>`<div class="row" style="flex-wrap:wrap"><div><span class="t">${x.invoices.suppliers.name}</span><small>${x.invoices.contracts.title} • ${x.invoices.code||''}</small><small>المحاسب: ${x.cr?.full_name||''} • ${fdate(x.created_at)}</small>${x.invoices.image_url?`<small>${imgL(x.invoices.image_url)}</small>`:''}${x.note?`<small>بيان: ${x.note}</small>`:''}</div><div style="text-align:end"><div class="amt">${money(x.amount)}</div><button class="b s g" onclick="chg('${x.id}',${x.amount},${x.invoices.amount-paidOf(x.invoices)})">تعديل المبلغ</button></div><div style="display:flex;gap:6px;width:100%"><button class="b s" onclick="decPay('${x.id}','approved')">اعتماد</button><button class="b s r" onclick="decPay('${x.id}','rejected')">رفض</button></div></div>`).join('')||'<small>لا توجد طلبات معلقة</small>')}
async function chg(id,cur,max){if(!await apvChk('payments',id))return;const v=prompt('المبلغ الجديد (الحد الأقصى '+max+')',cur);if(v===null)return;const n=+v;if(!(n>0)||n>max)return msg('المبلغ غير صالح أو أكبر من المتبقي',1);
await api('payments?id=eq.'+id,'PATCH',{amount:n});await audit('تعديل مبلغ طلب دفع (رئيس المجلس)','payments',id,null,{'المبلغ':cur},{'المبلغ':n});msg('تم تعديل المبلغ — يمكنك اعتماده الآن');$('#pl').className='hide';pend();cnt()}
async function decPay(id,s){if(s=='rejected'&&!confirm('رفض هذا الطلب؟'))return;if(!await apvChk('payments',id))return;try{const r=await api('payments?id=eq.'+id+'&status=eq.pending','PATCH',{status:s,approved_by:me().id,decided_at:new Date().toISOString()});if(!r.length)return msg('تم البت في هذا الطلب من قبل أو لم يعد موجودًا',1);
 await audit(s=='approved'?'اعتماد دفعة (رئيس المجلس)':'رفض دفعة (رئيس المجلس)','payments',id,null,null,{'المبلغ':r[0].amount});msg(s=='approved'?'تم الاعتماد':'تم الرفض');$('#pl').className='hide';pend();cnt()}catch(e){msg(errT(e),1)}}
// ---- فواتير الخزينة بانتظار الاعتماد (تعديل المبلغ + اعتماد/رفض) ----
const HE=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
async function pendInv(){ov('فواتير الخزينة بانتظار الاعتماد');$('#cw').className='hide';CWK=null;$('#pl').className='hide';$('#rp').className='hide';const b=$('#pi');if(!b.classList.contains('hide')){b.className='hide';return}await drawInv()}
async function drawInv(){const b=$('#pi');try{const p=(await api('invoices?apv=eq.pending&dest=eq.treasury&select=*,suppliers(name,code),contracts(title),cr:users!invoices_created_by_fkey(full_name)&order=created_at')).filter(x=>canApv(x.account_id));
 b.className='card';b.innerHTML='<h2>فواتير الخزينة بانتظار الاعتماد (يعتمدها رئيس المجلس أو مدير الحسابات)</h2>'+(p.map(x=>`<div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:200px"><span class="t">${HE(x.suppliers.name)}</span> <span class="bd" style="background:#e8f1f0">${x.type=='income'?'تحصيل':'صرف'}</span><small>${HE(x.contracts.title)} • فاتورة ${HE(x.code||'')}</small><small>${HE(x.description||'')}</small><small>تاريخ الفاتورة: ${fdate(x.created_at)} • أنشأها: ${HE(x.cr?.full_name||'')}</small>${x.image_url?`<a href="${HE(x.image_url)}" target="_blank">عرض صورة الفاتورة</a>`:''}</div><div class="amt" style="text-align:end">${money(x.amount)}</div><div style="display:flex;gap:6px;width:100%"><button class="b s" onclick="decInv('${x.id}','approved')">اعتماد وإرسال للخزينة</button><button class="b s g" onclick="chgInv('${x.id}',${x.amount})">تعديل المبلغ</button><button class="b s r" onclick="decInv('${x.id}','rejected')">رفض</button></div></div>`).join('')||'<small>لا توجد فواتير بانتظار الاعتماد</small>')}catch(e){msg(errT(e),1)}}
async function chgInv(id,cur){if(!await apvChk('invoices',id))return;const v=prompt('المبلغ الجديد للفاتورة',cur);if(v===null)return;const n=+v;if(!(n>0))return msg('المبلغ غير صالح',1);
 try{const r=await api('invoices?id=eq.'+id+'&apv=eq.pending','PATCH',{amount:n});if(!r.length)return msg('تم البت في هذه الفاتورة من قبل أو لم تعد موجودة',1);await audit('تعديل مبلغ فاتورة قبل الاعتماد (رئيس المجلس)','invoices',id,r[0].contract_id,{'المبلغ':cur,'الكود':r[0].code},{'المبلغ':n,'الكود':r[0].code});msg('تم تعديل المبلغ — يمكنك اعتماد الفاتورة الآن');drawInv()}catch(e){msg(errT(e),1)}}
async function decInv(id,s){if(!await apvChk('invoices',id))return;let note=null;if(s=='rejected'){note=prompt('سبب الرفض (اختياري)');if(note===null)return}
 try{const r=await api('invoices?id=eq.'+id+'&apv=eq.pending','PATCH',{apv:s,apv_by:me().id,apv_at:new Date().toISOString(),apv_note:note||null});if(!r.length)return msg('تم البت في هذه الفاتورة من قبل أو لم تعد موجودة',1);
  await audit(s=='approved'?'اعتماد فاتورة للخزينة (رئيس المجلس)':'رفض فاتورة للخزينة (رئيس المجلس)','invoices',id,r[0].contract_id,null,{'الكود':r[0].code,'المبلغ':r[0].amount},note);msg(s=='approved'?'تم اعتماد الفاتورة وأُرسلت للخزينة':'تم رفض الفاتورة');drawInv();cnt()}catch(e){msg(errT(e),1)}}
function find(){clearTimeout(t);t=setTimeout(async()=>{const v=$('#q').value.trim();if(!v)return goHome();ov('نتائج البحث');$('#res').className='';
const s=await api(`suppliers?or=(name.ilike.*${encodeURIComponent(v)}*,code.ilike.*${encodeURIComponent(v)}*)&limit=15`);
$('#res').innerHTML=s.map(x=>`<div class="card" onclick="show('${x.id}')" style="cursor:pointer"><span class="t">${x.name}</span><small>${x.code} • ${x.field||''}</small></div>`).join('')||'<div class="msg">لا توجد نتائج</div>'},250)}
const stl=v=>v.d>0&&!(v.p>0)?v.d:v.p>0&&!(v.d>0)?v.p:Math.max(v.p,v.d);
async function show(id){ov('بيانات المورد');$('#res').innerHTML='';const s=(await api('suppliers?id=eq.'+id))[0];
const inv0=await api(`invoices?supplier_id=eq.${id}&select=*,contracts(title),cr:users!invoices_created_by_fkey(full_name),payments(amount,note,status,created_at,pc:users!payments_created_by_fkey(full_name))&order=created_at.desc`);
const CT=await api('contracts?supplier_id=eq.'+id+'&select=id,title,agreed_amount,carried_amount,start_date,end_date&order=created_at.desc');let PR=[];try{PR=CT.length?await api('contract_periods?contract_id=in.('+CT.map(x=>x.id).join(',')+')&order=period_no'):[]}catch(e){}
const cst=new Map(CT.map(x=>[x.id,x.start_date])),inv=ALLP?inv0:inv0.filter(i=>{const s=cst.get(i.contract_id);return !s||i.created_at.slice(0,10)>=s});
const pays=inv.filter(i=>i.type!='income'),tot=pays.reduce((a,i)=>a+paidOf(i),0),rest=pays.reduce((a,i)=>a+Math.max(0,i.amount-paidOf(i)),0),ld=i=>Math.max(0,...(i.payments||[]).filter(p=>p.status=='approved').map(p=>+new Date(p.created_at))),last=inv.filter(i=>paidOf(i)>0).sort((a,b)=>ld(b)-ld(a))[0];
window._i=inv;const dep=inv.filter(i=>i.type=='income').reduce((a,i)=>a+paidOf(i),0),rec=inv.filter(i=>i.type=='income'&&i.dest=='treasury'&&(i.apv||'approved')=='approved').reduce((a,i)=>a+Math.max(0,i.amount-paidOf(i)),0);const g={};CT.forEach(c=>{const h=PR.filter(p=>p.contract_id==c.id),cur=c.agreed_amount==null?null:+c.agreed_amount,past=h.reduce((s,p)=>s+(+p.agreed_amount||0),0),car=+c.carried_amount||0;g[c.id]={t:c.title,p:0,r:0,d:0,v:ALLP?((cur==null&&!past)?null:(cur||0)+past):(cur==null?null:cur+car),s:c.start_date,e:c.end_date,h,car}});inv.forEach(i=>{const k=i.contract_id;g[k]=g[k]||{t:i.contracts.title,p:0,r:0,d:0};if(i.type=='income'){g[k].d+=paidOf(i);if(i.dest=='treasury'&&(i.apv||'approved')=='approved')g[k].rc=(g[k].rc||0)+Math.max(0,i.amount-paidOf(i));return}g[k].p+=paidOf(i);g[k].r+=Math.max(0,i.amount-paidOf(i))});
const GV=Object.values(g).filter(v=>v.v!=null),cv=GV.reduce((s,v)=>s+v.v,0),cr=GV.reduce((s,v)=>s+Math.max(0,v.v-stl(v)),0);$('#det').className='';$('#det').innerHTML=`<div class="card"><h2>${s.name}</h2><small>${s.code} • ${s.phone?`<a href="tel:${s.phone}">${s.phone}</a>`:''} • ${s.field||''}</small><label class="ck" style="margin-top:8px"><input type="checkbox" ${ALLP?'checked':''} onchange="ALLP=this.checked;show('${id}')">عرض كل ما دفعه الشخص عبر كل الفترات التعاقدية <small>(غير مفعّل: مدفوعات العقد الحالي فقط)</small></label></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${cv>0?`<div class="stat"><small>1 • إجمالي قيمة العقود</small><b>${money(cv)}</b></div>`:''}${dep?`<div class="stat"><small>2 • إجمالي الإيداع من المورد</small><b style="color:#237a4b">${money(dep)}</b></div>`:''}${cv>0?`<div class="stat"><small>3 • المتبقي من قيمة العقود</small><b style="color:#b3341f">${money(cr)}</b></div>`:''}<div class="stat"><small>4 • إجمالي المدفوع (دفع)</small><b>${money(tot)}</b></div><div class="stat link" onclick="partial()"><small>الباقي من فواتير الدفع (اضغط)</small><b>${money(rest)}</b></div>${rec?`<div class="stat"><small>مستحق تحصيله من المورد</small><b style="color:#b8862b">${money(rec)}</b></div>`:''}</div>
<div class="card" style="margin-top:12px"><h2>حسب التعاقد</h2>${Object.entries(g).map(([k,v])=>{const hv=v.v!=null,pb=hv&&(v.p>0||!v.d),per=ALLP&&v.h&&v.h.length?`كل الفترات التعاقدية (${v.h.length+1})`:(v.s&&v.e?`فترة العقد: ${fdu(v.s)} ← ${fdu(v.e)}`:'');return `<div class="row" onclick="showPays('${k}')" style="cursor:pointer;align-items:flex-start"><div><span class="t">${v.t}</span>${per?`<small>${per}</small>`:''}${!ALLP&&v.car>0?`<small>منها مرحَّل من الفترة السابقة ${money(v.car)}</small>`:''}${ALLP&&v.h&&v.h.length?v.h.map(p=>`<small>الفترة ${p.period_no}: ${fdu(p.start_date)} ← ${fdu(p.end_date)} • قيمة ${money(p.agreed_amount)} • متبقٍ ${money(p.remaining)}${+p.carried_out>0?' (رُحِّل '+money(p.carried_out)+')':''}</small>`).join(''):''}<small>اضغط لعرض تفاصيله</small></div><div class="amt" style="text-align:end"><small style="color:#4a5f66">${hv?'قيمة العقد '+money(v.v):'لم تُحدَّد قيمة العقد'}</small>${money(v.p)}<small style="color:#4a5f66">مدفوع</small>${hv?`<small style="color:var(--bad)">المتبقي من العقد ${money(Math.max(0,v.v-stl(v)))}</small>`:''}<small style="color:var(--bad)">باقٍ من الفواتير ${money(v.r)}</small>${v.d?`<small style="color:#237a4b">إيداع ${money(v.d)}</small>`:''}${v.rc?`<small style="color:#b8862b">مستحق تحصيله ${money(v.rc)}</small>`:''}</div></div>`}).join('')||'<small>لا توجد تعاقدات</small>'}</div>
${last?`<div class="card"><h2>آخر فاتورة معتمدة</h2><div class="row"><div><span class="t">${last.contracts.title}</span>${tb(last)}<small>${last.code||''} • ${fdate(last.created_at)}</small><small>${last.description||''}</small><small>نفّذها: ${last.cr?.full_name||''}</small><small>آخر دفعة معتمدة: ${fdate(ld(last))}</small></div><div class="amt">${money(last.amount)}<small>مدفوع ${money(paidOf(last))}</small></div></div>${last.image_url?`<a href="${last.image_url}" target="_blank">صورة الفاتورة</a>`:''}</div>`:''}
<button class="b g" onclick="showPays()">عرض تفصيلي لكل المدفوعات</button><div id="more"></div>`}
function showPays(cid){const rows=[];_i.filter(i=>!cid||i.contract_id==cid).forEach(i=>(i.payments||[]).filter(p=>p.status=='approved').forEach(p=>rows.push({i,p})));rows.sort((a,b)=>new Date(b.p.created_at)-new Date(a.p.created_at));
$('#more').innerHTML=`<h2 style="margin-top:14px">${cid?'مدفوعات التعاقد':'كل المدفوعات'}</h2><small>إجمالي الشهر يشمل الدفع فقط ولا يشمل الإيداع</small>`+(months(rows,x=>x.p.created_at,x=>`<div class="row"><div><span class="t">${x.i.contracts.title}</span>${tb(x.i)}<small>${x.i.description||''} • ${fdate(x.p.created_at)}</small><small>نفّذها: ${x.p.pc?.full_name||''}</small>${x.p.note?`<small>بيان: ${x.p.note}</small>`:''}${x.i.image_url?`<small>${imgL(x.i.image_url)}</small>`:''}</div><div class="amt">${money(x.p.amount)}</div></div>`,x=>x.i.type=='income'?0:+x.p.amount)||'<small>لا يوجد</small>');$('#more').scrollIntoView()}
function partial(){const r=_i.filter(i=>i.type!='income'&&i.amount-paidOf(i)>0.001).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
$('#more').innerHTML='<h2 style="margin-top:14px">فواتير بها باقٍ</h2>'+(months(r,x=>x.created_at,i=>`<div class="row"><div><span class="t">${i.contracts.title}</span>${tb(i)}<small>${i.code||''} • ${i.description||''} • ${fdate(i.created_at)}</small><small>الفاتورة ${money(i.amount)} • مدفوع ${money(paidOf(i))}</small><small>أنشأها: ${i.cr?.full_name||'—'}</small>${payers(i)}${i.image_url?`<small>${imgL(i.image_url)}</small>`:''}</div><div class="amt" style="color:var(--bad)">${money(i.amount-paidOf(i))}</div></div>`,i=>i.amount-paidOf(i))||'<small>لا يوجد باقٍ</small>');$('#more').scrollIntoView()}
async function cnt(){const n=(await api('payments?status=eq.pending&select=id,invoices(account_id)')).filter(x=>canApv((x.invoices||{}).account_id)).length;let m=0;try{m=(await api('invoices?apv=eq.pending&select=id,account_id')).filter(x=>canApv(x.account_id)).length}catch(e){}
$('#pbA').innerHTML=card('shield','فواتير الخزينة بانتظار الاعتماد',m?m+' فاتورة — اعتماد أو تعديل المبلغ أو رفض':'لا توجد فواتير بانتظار الاعتماد',"pendInv()")+card('receipt','تحويلات بانتظار الاعتماد',n?n+' طلب — اعتماد أو تعديل المبلغ أو رفض':'لا توجد طلبات حالية',"pend()");
$('#pbB').innerHTML=card('chart','تقرير سريع','المدفوعات والإيرادات: اليوم أو الأسبوع أو الشهر أو فترة',"repOpen()")+card('wallet','إيراد الخزينة الطبيعي','ما دخل الخزينة وما خرج منها فقط — اليوم أو يوم/شهر/فترة',"cashOpen('treasury')")+card('list','التحويلات','التحويلات المنفَّذة فقط — اليوم أو يوم/شهر/فترة',"cashOpen('accounts')")+card('folder','كشف الحسابات','اختر حسابًا لعرض إجمالي ما دُفع به وفواتيره',"acctOpen()")}
function cashOpen(k){ov(k=='treasury'?'إيراد الخزينة الطبيعي':'التحويلات');const b=$('#cw');if(CWK==k&&!b.classList.contains('hide')){b.className='hide';CWK=null;return}CWK=k;$('#pl').className='hide';$('#pi').className='hide';$('#rp').className='hide';b.className='';cashWidget(b,{id:'cw'+k,fields:[...CRD,'img'],split:k=='treasury',dest:k,bal:k=='treasury',title:k=='treasury'?'إيراد الخزينة الطبيعي':'التحويلات',hint:k=='treasury'?'المبالغ التي دخلت الخزينة (إيراد) أو خرجت منها (مصروف) فقط، دون أي تحويلات.':'التحويلات المنفَّذة فقط (إيراد ومصروف)، دون حركات الخزينة.',file:k=='treasury'?'treasury_revenue':'transfers'});b.scrollIntoView()}

const tb=i=>`<span class="bd ${i.type=='income'?'on':''}" style="margin-inline-start:6px;${i.type=='income'?'':'background:#e8f1f0'}">${({pay:'دفع',income:'إيداع',bill:'فاتورة'})[i.type]||''}</span>`;
const payers=i=>{const n=[...new Set((i.payments||[]).filter(p=>p.status=='approved').map(p=>p.pc?.full_name).filter(Boolean))];return n.length?`<small>دفعها: ${n.join('، ')}</small>`:''};
let ALL=[],SEL=[],LM={};const lday=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let RT='both',RP='day';
const sel=(g,x)=>document.querySelectorAll('#'+g+' button').forEach(y=>y.classList.toggle('on',y==x));
async function repOpen(){ov('تقرير سريع');$('#cw').className='hide';CWK=null;$('#pi').className='hide';const b=$('#rp');if(!b.classList.contains('hide')){b.className='hide';return}

async function runRep(){try{const t=new Date(),f=new Date(t);if(RP=='week')f.setDate(t.getDate()-6);if(RP=='month')f.setDate(1);let a=lday(f),b=lday(t);

 if(RP=='pmonth'){const v=$('#r4').value;if(!v){$('#ro').innerHTML='<div class="msg" style="margin-top:10px">اختر الشهر لعرض حركاته</div>';return}a=v+'-01';b=v+'-'+String(new Date(+v.slice(0,4),+v.slice(5,7),0).getDate()).padStart(2,'0')}
 let q='payments?status=eq.approved&select=amount,fee,note,created_at,invoices!inner(type,code,description,amount,image_url,supplier_id,suppliers(name,code),contracts(title),ic:users!invoices_created_by_fkey(full_name)),pc:users!payments_created_by_fkey(full_name)&order=created_at.desc';

 if(SEL.length)q+='&invoices.supplier_id=in.('+SEL.join(',')+')';if(a)q+='&created_at=gte.'+a+'T00:00:00Z';if(b)q+='&created_at=lte.'+b+'T23:59:59Z';
 const P=(await api(q)).sort((x,y)=>new Date(y.created_at)-new Date(x.created_at)),isI=x=>x.invoices.type=='income',sum=l=>l.reduce((s,x)=>s+ +x.amount,0),sf=l=>l.reduce((s,x)=>s+(+x.fee||0),0),tp=sum(P.filter(x=>!isI(x))),ti=sum(P.filter(isI)),tf=sf(P);
 const st=[];if(RT!='inc')st.push(['إجمالي المدفوع',money(tp),'#b3341f']);if(RT!='pay'){st.push(['إجمالي الإيرادات (تحصيل)',money(ti),'#237a4b']);if(tf>0)st.push(['رسوم التأخير المحصّلة',money(tf),'#b8862b'])}
 const g={};P.forEach(x=>{(g[x.created_at.slice(0,10)]=g[x.created_at.slice(0,10)]||[]).push(x)});
 const row=x=>{const i=isI(x);return `<div class="row"><div><span class="t">${x.invoices.suppliers.name}</span>${tb(x.invoices)}<small>${x.invoices.contracts.title} • فاتورة ${x.invoices.code||''}</small>${x.invoices.description?`<small>${x.invoices.description}</small>`:''}${x.invoices.image_url?`<small>${imgL(x.invoices.image_url)}</small>`:''}${x.note?`<small>بيان: ${x.note}</small>`:''}<small>أنشأ الفاتورة: ${x.invoices.ic?.full_name||'—'} • ${i?'حصّلها':'نفّذها'}: ${x.pc?.full_name||''}</small></div><div class="amt" style="color:${i?'#237a4b':'#b3341f'};text-align:end">${i?'+':'−'} ${money(x.amount)}<small style="color:#4a5f66">${i?'تم تحصيله':'تم دفعه'} • من فاتورة ${money(x.invoices.amount)}</small>${+x.fee>0?`<small style="color:#b8862b">+ رسوم تأخير ${money(x.fee)}</small>`:''}</div></div>`};
 $('#ro').innerHTML=`<small style="display:block;margin-top:10px">${a?fdate(a):'البداية'} ← ${b?fdate(b):'اليوم'} • ${P.length} حركة معتمدة</small><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0">${st.map(([k,v,c])=>`<div class="stat"><small>${k}</small><b style="color:${c}">${v}</b></div>`).join('')}</div>`+
 (Object.keys(g).sort().reverse().map(k=>{const L=g[k],d=new Date(k+'T00:00:00Z').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}),li=L.filter(isI);

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0"><div class="stat"><small>القيمة الافتتاحية</small><b>${money(op)}</b></div><div class="stat"><small>إجمالي المدفوع (مصروف)</small><b style="color:#b3341f">${money(sp)}</b></div><div class="stat"><small>إجمالي المحصَّل (إيراد)</small><b style="color:#237a4b">${money(sr)}</b></div><div class="stat" style="border-color:var(--gold)"><small>الإجمالي الحالي (الافتتاحي + ${acc.kind=='revenue'?'المحصَّل':'المدفوع'})</small><b>${money(cur)}</b></div><div class="stat"><small>عدد الفواتير</small><b>${L.length}</b></div></div>
