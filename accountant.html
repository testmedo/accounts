<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المحاسبة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=4"></head><body>
<main><div id="msg" class="hide"></div>
<div id="home" class="cards"></div>

<section id="sup" class="hide"><button class="back" onclick="go()">→ رجوع</button><div class="card"><h2>إضافة مورد جديد</h2>
<label>الاسم</label><input id="sn"><label>رقم الهاتف</label><input id="sp" type="tel"><label>كود الموظف</label><input id="sc"><label>مجال العمل</label><input id="sf">
<button class="b" onclick="addSup()">حفظ المورد</button></div></section>

<section id="con" class="hide"><button class="back" onclick="go()">→ رجوع</button><div class="card"><h2>إنشاء سجل تعاقدي</h2>
<label>المورد</label><select id="cs" onchange="fill()"></select><div id="info" class="msg hide"></div>
<label>اسم المعاملة (مثال: عقد إنشاءات كلية الطب البشري)</label><input id="ct"><label>المبلغ التقريبي المتفق عليه (اختياري)</label><input id="ca" type="number" inputmode="decimal">
<button class="b" onclick="addCon()">إنشاء السجل</button></div></section>

<section id="inv" class="hide"><button class="back" onclick="go()">→ رجوع</button><div class="card"><h2>إنشاء فاتورة فرعية</h2>
<label>السجل التعاقدي</label><select id="ic"></select><label>نوع الفاتورة</label><select id="it"><option value="pay">دفع إلى</option><option value="income">إيراد من</option></select>
<label>كود الفاتورة</label><input id="icode"><label>المبلغ</label><input id="iam" type="number" inputmode="decimal"><label>البيان</label><textarea id="ides" rows="2"></textarea>
<label>صورة الفاتورة الورقية</label><input id="iimg" type="file" accept="image/*"><label>المبلغ المراد دفعه الآن</label><input id="ipay" type="number" inputmode="decimal">
<button class="b" onclick="addInv()">حفظ وإرسال للاعتماد</button></div></section>

<section id="open" class="hide"><button class="back" onclick="go()">→ رجوع</button><div class="card"><h2>فواتير بها مبالغ متبقية</h2><div id="olist"></div></div></section>

<section id="list" class="hide"><button class="back" onclick="go()">→ رجوع</button><div class="card"><input id="lq" placeholder="ابحث باسم المورد أو كوده" oninput="draw()"></div><div id="llist"></div></section>
</main>
<script src="js/app.js?v=4"></script><script>
const U=guard(['accountant','manager','admin']);let S=[],C=[],I=[];
function go(id){['home','sup','con','inv','open','list'].forEach(x=>$('#'+x).classList.toggle('hide',x!=(id||'home')));$('#msg').className='hide';scrollTo(0,0)}
async function load(){[S,C,I]=await Promise.all([api('suppliers?order=name'),api('contracts?select=*&order=created_at.desc'),api('invoices?select=*,suppliers(name),contracts(title),payments(amount,status)&order=created_at.desc')]);
 $('#cs').innerHTML='<option value="">اختر المورد</option>'+S.map(s=>`<option value="${s.id}">${s.name} (${s.code})</option>`).join('');
 $('#ic').innerHTML=C.map(c=>`<option value="${c.id}">${S.find(s=>s.id==c.supplier_id)?.name} — ${c.title}</option>`).join('');
 const o=I.filter(i=>i.amount-paidOf(i)>0.001);
 $('#olist').innerHTML=o.map(i=>`<div class="row"><div><span class="t">${i.suppliers.name}</span><small>${i.contracts.title} • ${i.code||''}</small><small>المتبقي ${money(i.amount-paidOf(i))}</small></div><button class="b s" onclick="payMore('${i.id}',${i.amount-paidOf(i)})">دفع</button></div>`).join('')||'<small>لا يوجد متبقٍ</small>';draw()}
function draw(){const q=$('#lq').value.trim().toLowerCase();
 $('#llist').innerHTML=S.filter(s=>!q||(s.name+s.code).toLowerCase().includes(q)).map(s=>{const cs=C.filter(c=>c.supplier_id==s.id);
 return `<details class="card"><summary><b>${s.name}</b> <small>${s.code} • ${s.field||''}</small></summary><small>${s.phone||''}</small>${cs.map(c=>{const iv=I.filter(i=>i.contract_id==c.id);return `<div class="row"><div><span class="t">${c.title}</span><small>${iv.length} فاتورة • مدفوع ${money(iv.reduce((a,i)=>a+paidOf(i),0))}</small></div><div class="amt">${c.agreed_amount?money(c.agreed_amount):''}</div></div>`}).join('')||'<small>لا توجد سجلات</small>'}</details>`}).join('')}
function fill(){const s=S.find(x=>x.id==$('#cs').value),i=$('#info');if(!s)return i.className='hide';i.className='msg';i.textContent=`${s.name} | ${s.code} | ${s.phone||''} | ${s.field||''}`}
async function addSup(){try{await api('suppliers','POST',{name:$('#sn').value,phone:$('#sp').value,code:$('#sc').value,field:$('#sf').value});await load();go();msg('تم حفظ المورد')}catch(e){msg('خطأ: '+e.message,1)}}
async function addCon(){try{await api('contracts','POST',{supplier_id:$('#cs').value,title:$('#ct').value,agreed_amount:$('#ca').value||null,created_by:U.id});await load();go();msg('تم إنشاء السجل التعاقدي')}catch(e){msg('خطأ: '+e.message,1)}}
async function addInv(){try{const c=C.find(x=>x.id==$('#ic').value);let url=null;if($('#iimg').files[0])url=await upload($('#iimg').files[0]);
 const amt=+$('#iam').value,pay=+$('#ipay').value;if(pay>amt)return msg('المبلغ المدفوع أكبر من الفاتورة',1);
 const i=(await api('invoices','POST',{contract_id:c.id,supplier_id:c.supplier_id,type:$('#it').value,code:$('#icode').value,amount:amt,description:$('#ides').value,image_url:url,created_by:U.id}))[0];
 if(pay>0)await api('payments','POST',{invoice_id:i.id,amount:pay,created_by:U.id});await load();go();msg('تم الحفظ — بانتظار اعتماد مدير الحسابات')}catch(e){msg('خطأ: '+e.message,1)}}
async function payMore(id,rest){const v=+prompt('المبلغ المراد دفعه (المتبقي '+rest+')');if(!v||v>rest)return;await api('payments','POST',{invoice_id:id,amount:v,created_by:U.id});await load();msg('أُرسل للاعتماد')}
$('#home').innerHTML=card('user','مورد جديد','إضافة مورد أو مقاول',"go('sup')")+card('folder','سجل تعاقدي جديد','عقد أو مشروع لمورد',"go('con')")+card('receipt','فاتورة فرعية','دفع إلى / إيراد من',"go('inv')")+card('wallet','دفع المتبقي','فواتير دُفع جزء منها',"go('open')")+card('list','الموردون والسجلات','بحث واستعراض',"go('list')")+card('chart','كشف الحساب','عرض وتحميل PDF أو Excel',"location.href='report.html'");
load();
</script></body></html>
