<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الاعتمادات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=25"></head><body>
<main><div id="msg" class="hide"></div><div id="home" class="cards"></div><section id="sec" class="hide"><button class="back" onclick="tab(0)">→ رجوع للتبويبات</button><div class="card frm" id="list"></div></section></main>
<div id="ov" class="ov hide"><div class="md"><h2><span>آخر فاتورة للشخص</span><button onclick="cl()">×</button></h2><div id="mb"></div><div id="mact" class="grid"></div></div></div>
<script src="js/app.js?v=25"></script><script>
const U=guard(['manager','admin']);let T=1;const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const SEL='select=*,invoices(id,supplier_id,payments(status),code,amount,description,image_url,created_at,ic:users!invoices_created_by_fkey(full_name),suppliers(name,code),contracts(title)),cr:users!payments_created_by_fkey(full_name),ap:users!payments_approved_by_fkey(full_name)';
async function homeDraw(){let n='…',m='…';try{n=(await api('payments?status=eq.pending&select=id')).length}catch(e){}try{m=(await api('invoices?apv=eq.pending&select=id')).length}catch(e){}
 $('#home').innerHTML=card('shield','فواتير الخزينة بانتظار الاعتماد',m+' فاتورة — لا تصل للخزينة قبل اعتمادها',"tab(3)")+card('receipt','تحويلات بانتظار الاعتماد',n+' تحويل — تُنفَّذ بمجرد اعتمادها',"tab(1)")+card('list','قرارات الفواتير السابقة','آخر 100 قرار على فواتير الخزينة',"tab(4)")+card('list','قرارات التحويلات السابقة','آخر 100 قرار (معتمد / مرفوض)',"tab(2)")}
function tab(n){T=n;$('#home').classList.toggle('hide',n!=0);$('#sec').classList.toggle('hide',n==0);$('#msg').className='hide';scrollTo(0,0);if(n==0)homeDraw();else load()}
const ISEL='select=*,suppliers(name,code,phone),contracts(title),cr:users!invoices_created_by_fkey(full_name),ap:users!invoices_apv_by_fkey(full_name)';
async function loadInv(){const p=await api(T==3?`invoices?apv=eq.pending&dest=eq.treasury&${ISEL}&order=created_at.desc`:`invoices?apv=in.(approved,rejected)&dest=eq.treasury&apv_by=not.is.null&${ISEL}&order=apv_at.desc&limit=100`);
$('#list').innerHTML=`<h2>${T==3?'فواتير الخزينة بانتظار الاعتماد':'قرارات الفواتير السابقة'}</h2>`+(p.map(x=>`<div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:200px"><span class="t">${E(x.suppliers.name)}</span> <span class="bd" style="background:#e8f1f0">${x.type=='income'?'تحصيل':'صرف'}</span><small>${E(x.contracts.title)} • فاتورة ${E(x.code||'')}</small><small>${E(x.description||'')}</small><small>تاريخ الفاتورة: ${fdate(x.created_at)} • أنشأها: ${E(x.cr?.full_name||'')}</small>${T==4?`<small>${x.apv=='approved'?'اعتمدها':'رفضها'}: ${E(x.ap?.full_name||'')} • ${x.apv_at?fdate(x.apv_at):''}${x.apv_note?' • '+E(x.apv_note):''}</small>`:''}${x.image_url?`<a href="${E(x.image_url)}" target="_blank">عرض صورة الفاتورة</a>`:''}</div>
<div class="amt">${money(x.amount)}${T==4?`<small style="color:${x.apv=='approved'?'#237a4b':'#b3341f'}">${x.apv=='approved'?'معتمدة':'مرفوضة'}</small>`:''}</div>${T==3?`<div style="display:flex;gap:6px;width:100%"><button class="b s" onclick="dI('${x.id}','approved')">اعتماد وإرسال للخزينة</button><button class="b s r" onclick="dI('${x.id}','rejected')">رفض</button><button class="b s g" onclick="lastInv('${x.supplier_id}','${x.id}','i','${x.id}')">آخر فاتورة للشخص</button></div>`:''}</div>`).join('')||'<small>لا يوجد</small>')}
const cl=()=>$('#ov').className='ov hide';
async function lastInv(sid,cur,kind,did){$('#mb').innerHTML='<small>جارٍ التحميل…</small>';$('#mact').innerHTML='';$('#ov').className='ov';
 try{const r=(await api(`invoices?supplier_id=eq.${sid}&id=neq.${cur}&apv=eq.approved&select=*,suppliers(name,code),contracts(title),cr:users!invoices_created_by_fkey(full_name),payments(amount,status)&order=created_at.desc&limit=1`))[0],pd=r?paidOf(r):0;
  $('#mb').innerHTML=r?`<div class="card" style="margin:0"><span class="t">${E(r.suppliers.name)}</span> <small>${E(r.suppliers.code)}</small><div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:180px"><small>${E(r.contracts.title)} • فاتورة ${E(r.code||'')} • ${r.type=='income'?'إيداع من':r.type=='bill'?'فاتورة':'مدفوع إلى'} • ${r.dest=='treasury'?'الخزينة':'تحويل'}</small><small>${E(r.description||'')}</small><small>تاريخ الفاتورة: ${fdate(r.created_at)} • أنشأها: ${E(r.cr?.full_name||'')}</small>${r.image_url?`<a href="${E(r.image_url)}" target="_blank">عرض صورة الفاتورة</a>`:''}</div><div class="amt">${money(r.amount)}<small>نُفِّذ ${money(pd)} • المتبقي ${money(Math.max(0,r.amount-pd))}</small></div></div></div>`:'<div class="msg">لا توجد فواتير سابقة لهذا الشخص</div>';
  $('#mact').innerHTML=`<button class="b" onclick="cl();${kind=='p'?'d':'dI'}('${did}','approved')">اعتماد</button><button class="b r" onclick="cl();${kind=='p'?'d':'dI'}('${did}','rejected')">رفض</button>`}catch(e){$('#mb').innerHTML='<div class="msg e">'+E(errT(e))+'</div>'}}
async function dI(id,s){let note=null;if(s=='rejected'){note=prompt('سبب الرفض (اختياري)');if(note===null)return}
 try{const r=await api('invoices?id=eq.'+id+'&apv=eq.pending','PATCH',{apv:s,apv_by:U.id,apv_at:new Date().toISOString(),apv_note:note||null});if(!r.length)return msg('تم البت في هذه الفاتورة من قبل أو لم تعد موجودة',1);
  await audit(s=='approved'?'اعتماد فاتورة للخزينة':'رفض فاتورة للخزينة','invoices',id,r[0].contract_id,null,{'الكود':r[0].code,'المبلغ':r[0].amount},note);msg(s=='approved'?'تم اعتماد الفاتورة وأُرسلت للخزينة':'تم رفض الفاتورة');loadInv()}catch(e){msg(errT(e),1)}}
async function load(){if(T>=3)return loadInv();const p=await api(T==1?`payments?status=eq.pending&${SEL}&order=created_at.desc`:`payments?status=in.(approved,rejected)&${SEL}&order=decided_at.desc&limit=100`);
$('#list').innerHTML=p.map(x=>`<div class="row" style="flex-wrap:wrap"><div style="flex:1;min-width:200px"><span class="t">${x.invoices.suppliers.name}</span><small>${x.invoices.contracts.title} • فاتورة ${x.invoices.code||''}</small><small>${x.invoices.description||''}</small>${x.note?`<small>بيان الدفعة: ${x.note}</small>`:''}<small>تاريخ الفاتورة: ${fdate(x.invoices.created_at)} • أنشأها: ${x.invoices.ic?.full_name||''}</small><small>طلب الدفع: ${x.cr?.full_name||''} • ${fdate(x.created_at)}</small>${T==2?`<small>${x.status=='approved'?'اعتمده':'رفضه'}: ${x.ap?.full_name||''} • ${x.decided_at?fdate(x.decided_at):''}</small>`:''}${x.invoices.image_url?`<a href="${x.invoices.image_url}" target="_blank">عرض صورة الفاتورة</a>`:''}</div>
<div class="amt">${money(x.amount)}<br><small>من ${money(x.invoices.amount)}</small>${T==2?`<small style="color:${x.status=='approved'?'#237a4b':'#b3341f'}">${x.status=='approved'?'معتمد':'مرفوض'}</small>`:''}</div>${T==1?`<div style="display:flex;gap:6px;width:100%"><button class="b s" onclick="d('${x.id}','approved')">اعتماد</button><button class="b s r" onclick="d('${x.id}','rejected')">رفض</button><button class="b s g" onclick="lastInv('${x.invoices.supplier_id}','${x.invoices.id}','p','${x.id}')">آخر فاتورة للشخص</button>${x.invoices.payments.some(p=>p.status=='approved')?'':`<button class="b s g" onclick="delInv('${x.invoices.id}')">حذف الفاتورة</button>`}</div>`:''}</div>`).join('')||'<small>لا يوجد</small>'}
async function delInv(id){if(!confirm('حذف هذه الفاتورة نهائيًا؟ (يُسمح فقط إذا لم يُدفع منها شيء)'))return;try{const f=await api('payments?invoice_id=eq.'+id+'&select=status');if(f.some(p=>p.status=='approved'))return msg('لا يمكن الحذف: تم دفع جزء من هذه الفاتورة',1);const r=await api('invoices?id=eq.'+id,'DELETE');if(!r.length)return msg('لم يتم الحذف',1);msg('تم حذف الفاتورة');load()}catch(e){msg(errT(e),1)}}
async function d(id,s){await api('payments?id=eq.'+id,'PATCH',{status:s,approved_by:U.id,decided_at:new Date().toISOString()});msg(s=='approved'?'تم الاعتماد':'تم الرفض');load()}
tab(0);
</script></body></html>
