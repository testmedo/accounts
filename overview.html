<script src="js/app.js?v=42"></script><script>
const U=guard(['chairman','manager','admin']);

const xML=k=>new Date(k+'-01T00:00:00Z').toLocaleDateString('ar-EG',{month:'long',year:'numeric',timeZone:'UTC'});

const PAL=['#2ec27e','#4aa8d8','#e5a823','#9b7bd6','#ef6b57','#35c2b5','#d98ab9','#8fb04a','#c97c3a','#6f8cff'];
const S={p:'year',dest:'',cur:0,auto:null,M:null,rows:[],CM:[],a:'',b:'',plabel:'',dlabel:'الكل',acct:''};
const WHO=/^المحص\S{1,3}ل\s*:\s*(.*)$/;
// ================= محرك الحساب =================
function normRow(x){const v=x.invoices||{},s=v.suppliers||{},inc=v.type=='income';let who='';
 String(x.note||'').split(' • ').map(z=>z.trim()).filter(Boolean).forEach((z,i)=>{const m=i==0&&z.match(WHO);if(m)who=m[1]});
 const pk=s.kind=='student'?'student':/موظف/.test(s.field||'')?'employee':'other',fee=+x.fee||0;
 return{inc,day:String(x.created_at).slice(0,10),mon:String(x.created_at).slice(0,7),amount:+x.amount,fee,total:rnd(+x.amount+fee),dest:v.dest||'accounts',acc:v.account_id||null,sid:v.supplier_id||null,cid:v.contract_id||null,iid:v.id,code:v.code||'',desc:v.description||'',img:v.image_url||'',iamt:+v.amount||0,type:v.type,sname:s.name||'—',scode:s.code||'',field:s.field||'',level:s.level||'',pk,ctitle:(v.contracts&&v.contracts.title)||'',who:who||(x.pc&&x.pc.full_name)||'—'}}
function normCM(i){const paid=(i.payments||[]).filter(p=>p.status=='approved').reduce((s,p)=>s+(+p.amount||0),0),s=i.suppliers||{};
 return{type:i.type,amount:+i.amount,paid,rem:rnd(+i.amount-paid),acc:i.account_id||null,sid:i.supplier_id||null,cid:i.contract_id||null,sname:s.name||'—',scode:s.code||'',pk:s.kind=='student'?'student':/موظف/.test(s.field||'')?'employee':'other',ctitle:(i.contracts&&i.contracts.title)||'',apv:i.apv}}
const sumBy=(l,f)=>rnd(l.reduce((s,r)=>s+f(r),0));
function groupBy(l,kf,init,add){const m=new Map();l.forEach(r=>{const k=kf(r);if(k==null)return;let o=m.get(k);if(!o){o=init(r,k);m.set(k,o)}add(o,r)});return[...m.values()]}
function accRollup(rows,ACCS){const own={};rows.forEach(r=>{const k=r.acc||'∅',o=own[k]=own[k]||{rev:0,exp:0,n:0};r.inc?o.rev+=r.total:o.exp+=r.total;o.n++});
 const kids={};ACCS.forEach(a=>(kids[a.parent_id||'root']=kids[a.parent_id||'root']||[]).push(a));const byId={};ACCS.forEach(a=>byId[a.id]=a),memo={};
 function roll(id,seen){if(memo[id])return memo[id];const o=own[id]||{rev:0,exp:0,n:0},t={rev:o.rev,exp:o.exp,n:o.n,ownRev:o.rev,ownExp:o.exp,ownN:o.n,a:byId[id],kids:[]};seen=new Set(seen||[]);seen.add(id);
  (kids[id]||[]).forEach(c=>{if(seen.has(c.id))return;const r=roll(c.id,seen);t.rev+=r.rev;t.exp+=r.exp;t.n+=r.n;t.kids.push(r)});t.rev=rnd(t.rev);t.exp=rnd(t.exp);memo[id]=t;return t}
 const roots=(kids.root||[]).map(a=>roll(a.id)).filter(r=>r.n>0).sort((x,y)=>(y.rev+y.exp)-(x.rev+x.exp));
 const flat=ACCS.map(a=>{const o=own[a.id]||{rev:0,exp:0,n:0};return{a,rev:rnd(o.rev),exp:rnd(o.exp),n:o.n}}).filter(x=>x.n>0);
 const orphan=ACCS.length&&rows.some(r=>r.acc&&!byId[r.acc])?null:null;
 return{roots,flat,none:own['∅']?{rev:rnd(own['∅'].rev),exp:rnd(own['∅'].exp),n:own['∅'].n}:null,roll}}
function buildModel(rows,prev,CMr,ACCS,range){
 const R=rows.filter(r=>r.inc),X=rows.filter(r=>!r.inc),M={rows,range};
 M.rev=sumBy(R,r=>r.total);M.exp=sumBy(X,r=>r.total);M.net=rnd(M.rev-M.exp);M.n=rows.length;M.fees=sumBy(rows,r=>r.fee);M.margin=M.rev>0?M.net/M.rev:null;M.avg=M.n?rnd((M.rev+M.exp)/M.n):0;
 M.prev=prev?{rev:prev.rev,exp:prev.exp,net:rnd(prev.rev-prev.exp)}:null;
 // السلسلة الزمنية
 const days=range.a&&range.b?Math.round((xU(range.b)-xU(range.a))/864e5)+1:null,bucket=days!=null&&days<=62?'day':'month';M.bucket=bucket;
 const kf=r=>bucket=='day'?r.day:r.mon,g=new Map();rows.forEach(r=>{const k=kf(r),o=g.get(k)||{k,rev:0,exp:0,n:0};r.inc?o.rev+=r.total:o.exp+=r.total;o.n++;g.set(k,o)});
 let keys=[];if(rows.length||(range.a&&range.b)){let a=range.a,b=range.b;if(!a||!b){const ds=rows.map(r=>r.day).sort();a=a||ds[0];b=b||ds[ds.length-1]}
  if(a&&b){if(bucket=='day'){for(let d=a;d<=b;d=xAdd(d,1))keys.push(d)}else keys=xMonths(a,b)}}
 let cum=0;M.series=keys.map(k=>{const o=g.get(k)||{rev:0,exp:0,n:0},net=rnd(o.rev-o.exp);cum=rnd(cum+net);return{k,rev:rnd(o.rev),exp:rnd(o.exp),n:o.n,net,cum}});
 M.dest={treasury:{rev:sumBy(R.filter(r=>r.dest=='treasury'),r=>r.total),exp:sumBy(X.filter(r=>r.dest=='treasury'),r=>r.total)},accounts:{rev:sumBy(R.filter(r=>r.dest!='treasury'),r=>r.total),exp:sumBy(X.filter(r=>r.dest!='treasury'),r=>r.total)}};
 M.acc=accRollup(rows,ACCS);
 M.ctr=groupBy(rows,r=>r.cid,r=>({cid:r.cid,title:r.ctitle||'—',sname:r.sname,rev:0,exp:0,n:0}),(o,r)=>{r.inc?o.rev=rnd(o.rev+r.total):o.exp=rnd(o.exp+r.total);o.n++});
 M.ppl=groupBy(rows,r=>r.sid,r=>({sid:r.sid,name:r.sname,code:r.scode,pk:r.pk,field:r.field,level:r.level,rev:0,exp:0,n:0}),(o,r)=>{r.inc?o.rev=rnd(o.rev+r.total):o.exp=rnd(o.exp+r.total);o.n++});
 const top=(l,f,n=10)=>l.filter(x=>f(x)>0).sort((x,y)=>f(y)-f(x)).slice(0,n);
 M.topPayees=top(M.ppl.filter(p=>p.pk!='student'),p=>p.exp);M.topEmp=top(M.ppl.filter(p=>p.pk=='employee'),p=>p.exp);M.topPayers=top(M.ppl.filter(p=>p.pk!='student'),p=>p.rev);M.topStu=top(M.ppl.filter(p=>p.pk=='student'),p=>p.rev);
 M.top5share=M.exp>0?sumBy(M.topPayees.slice(0,5),p=>p.exp)/M.exp:null;
 const stu=rows.filter(r=>r.pk=='student'&&r.inc);M.stuRev=sumBy(stu,r=>r.total);M.stuN=new Set(stu.map(r=>r.sid)).size;
 M.colleges=groupBy(stu,r=>r.field||'غير محدد',(r,k)=>({k,rev:0,ids:new Set(),n:0}),(o,r)=>{o.rev=rnd(o.rev+r.total);o.ids.add(r.sid);o.n++}).map(o=>({k:o.k,rev:o.rev,cnt:o.ids.size,n:o.n})).sort((x,y)=>y.rev-x.rev);
 M.levels=groupBy(stu,r=>r.level||'غير محدد',(r,k)=>({k,rev:0,ids:new Set(),n:0}),(o,r)=>{o.rev=rnd(o.rev+r.total);o.ids.add(r.sid);o.n++}).map(o=>({k:o.k,rev:o.rev,cnt:o.ids.size,n:o.n})).sort((x,y)=>y.rev-x.rev);
 M.team=groupBy(rows,r=>r.who,(r,k)=>({k,col:0,paid:0,n:0}),(o,r)=>{r.inc?o.col=rnd(o.col+r.total):o.paid=rnd(o.paid+r.total);o.n++}).sort((x,y)=>(y.col+y.paid)-(x.col+x.paid));
 M.topTx=rows.slice().sort((x,y)=>y.total-x.total).slice(0,10);
 const nd=M.series.filter(s=>s.n>0);M.bestRev=nd.slice().sort((x,y)=>y.rev-x.rev)[0]||null;M.bestExp=nd.slice().sort((x,y)=>y.exp-x.exp)[0]||null;M.bestNet=nd.slice().sort((x,y)=>y.net-x.net)[0]||null;M.worstNet=nd.slice().sort((x,y)=>x.net-y.net)[0]||null;
 // المستحقات (حتى اليوم)
 const C=CMr.map(x=>x).filter(x=>x.apv!='rejected'),rc=C.filter(x=>x.type=='income'&&x.rem>0.009),py=C.filter(x=>x.type!='income'&&x.rem>0.009);M.CM=C;
 M.recv=sumBy(rc,x=>x.rem);M.pay=sumBy(py,x=>x.rem);M.recvN=rc.length;M.payN=py.length;
 const byP=(l)=>groupBy(l,x=>x.sid,x=>({sid:x.sid,name:x.sname,code:x.scode,v:0,n:0}),(o,x)=>{o.v=rnd(o.v+x.rem);o.n++}).sort((a,b)=>b.v-a.v).slice(0,8),byC=(l)=>groupBy(l,x=>x.cid,x=>({cid:x.cid,title:x.ctitle||'—',sname:x.sname,v:0,n:0}),(o,x)=>{o.v=rnd(o.v+x.rem);o.n++}).sort((a,b)=>b.v-a.v).slice(0,8);
 M.debtors=byP(rc);M.creditors=byP(py);M.recvC=byC(rc);M.payC=byC(py);

 M.after=rnd(M.net+M.recv-M.pay);const mm=M.bucket=='month'?M.series.filter(s=>s.n>0||true):[];
 if(M.bucket=='month'&&M.series.length>=2){M.avgNet=rnd(sumBy(M.series,s=>s.net)/M.series.length);M.proj3=rnd(M.avgNet*3);M.projY=rnd(M.avgNet*12)}
