<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحسابات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css?v=12"></head><body>
<main><div id="msg" class="hide"></div>
<details class="card"><summary><b>+ إنشاء حساب جديد</b></summary><label>الاسم</label><input id="n_name"><label>اسم المستخدم</label><input id="n_user" autocapitalize="none"><label>كلمة المرور</label><input id="n_pass"><label>الصلاحية</label><select id="n_role"></select><button class="b" onclick="add()">إنشاء</button></details>
<div id="l"></div></main>
<script src="js/app.js?v=12"></script><script>
const U=guard(['admin']);const RL={accountant:'محاسب',manager:'مدير الحسابات',chairman:'رئيس مجلس الأمناء',admin:'أدمن'};
const opts=s=>Object.entries(RL).map(([k,v])=>`<option value="${k}" ${k==s?'selected':''}>${v}</option>`).join('');$('#n_role').innerHTML=opts('accountant');
async function load(){const u=await api('users?order=full_name');$('#l').innerHTML=u.map(x=>`<details class="card"><summary><b>${x.full_name}</b> <small>${x.username} • ${RL[x.role]}</small> <span class="bd ${x.active?'on':'off'}">${x.active?'نشط':'موقوف'}</span></summary>
<label>الاسم</label><input id="a${x.id}" value="${x.full_name}"><label>اسم المستخدم</label><input id="b${x.id}" value="${x.username}" autocapitalize="none"><label>كلمة المرور</label><input id="c${x.id}" value="${x.password}"><label>الصلاحية</label><select id="d${x.id}">${opts(x.role)}</select>
<div class="grid"><button class="b" onclick="save('${x.id}')">حفظ</button><button class="b ${x.active?'r':'g'}" onclick="tog('${x.id}',${!x.active})">${x.active?'إيقاف الحساب':'تفعيل الحساب'}</button></div></details>`).join('')}
async function add(){try{if(!$('#n_name').value||!$('#n_user').value||!$('#n_pass').value)return msg('أكمل كل الحقول',1);await api('users','POST',{full_name:$('#n_name').value,username:$('#n_user').value.trim(),password:$('#n_pass').value,role:$('#n_role').value});msg('تم إنشاء الحساب');['n_name','n_user','n_pass'].forEach(i=>$('#'+i).value='');load()}catch(e){msg(/23505|duplicate/.test(e.message)?'اسم المستخدم مستخدم من قبل':'تعذر الإنشاء: '+e.message,1)}}
async function save(id){try{await api('users?id=eq.'+id,'PATCH',{full_name:$('#a'+id).value,username:$('#b'+id).value.trim(),password:$('#c'+id).value,role:$('#d'+id).value});msg('تم الحفظ');load()}catch(e){msg(/23505|duplicate/.test(e.message)?'اسم المستخدم مستخدم من قبل':'تعذر الحفظ: '+e.message,1)}}
async function tog(id,v){if(id==U.id&&!v)return msg('لا يمكنك إيقاف حسابك الحالي',1);await api('users?id=eq.'+id,'PATCH',{active:v});msg(v?'تم تفعيل الحساب':'تم إيقاف الحساب');load()}
load();
</script></body></html>
